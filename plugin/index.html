<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Documents</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="product-experience.css"><link rel="stylesheet" href="plugin-shell.css"></head>
<body class="product-v2"><main id="plugin-workspace">
      <section id="view-docs" class="view">
        <div class="docs-layout">
          <aside class="docs-side">
            <div class="docs-side-head"><span>Documents</span><button id="btn-new-doc" class="linklike">+ New</button></div>
            <div class="docs-file-actions"><button id="doc-import" class="linklike">Import</button><button id="doc-export" class="linklike">Export</button></div><div id="doc-list"></div>
          </aside>
          <div class="docs-main">
            <input id="doc-title" placeholder="Title" maxlength="80" />
            <textarea id="doc-body" placeholder="Write here. Select some text (or nothing, for the whole document) and use the AI bar below — suggestions preview first, and only Apply changes your words." spellcheck="true"></textarea>
            <div class="docs-status"><span id="doc-words"></span><span id="doc-saved"></span></div>
            <div class="docs-ai-bar">
              <select id="doc-model" title="Model for suggestions"></select>
              <button class="doc-act" data-act="improve">Improve</button>
              <button class="doc-act" data-act="grammar">Fix grammar</button>
              <button class="doc-act" data-act="shorten">Shorten</button>
              <button class="doc-act" data-act="expand">Expand</button>
              <button class="doc-act" data-act="continue">Continue</button>
              <input id="doc-custom" placeholder="…or tell it what to do (e.g. “make this friendlier”)" />
              <button id="doc-custom-go" class="doc-act primary">Go</button>
            </div>
            <div id="doc-suggest" hidden>
              <div class="doc-suggest-head"><span id="doc-suggest-label">Suggestion</span><span id="doc-suggest-target" class="hint"></span></div>
              <div id="doc-suggest-status" role="status" aria-live="polite"></div>
              <div id="doc-suggest-body"></div>
              <div class="doc-suggest-actions">
                <button id="doc-apply" class="primary small">Apply</button>
                <button id="doc-discard" class="doc-act">Discard</button>
                <button id="doc-suggest-stop" class="doc-act" hidden>Stop</button>
              </div>
            </div>
          </div>
        </div>
      </section>
</main>
<script src="locales/catalogs.js"></script>
<script src="i18n.js"></script>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body></html>
