<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documents</title><link rel="stylesheet" href="style.css"></head><body><header><div><div class="eyebrow">A SPACE FOR YOUR IDEAS</div><h1>Documents</h1><p>Write, refine and keep your work on this computer.</p></div><div class="actions"><button id="import">Import text</button><button id="new" class="primary">New document</button></div></header><div id="message" role="status" hidden></div><div class="toolbar"><label class="sr-only" for="search">Find a document</label><input id="search" type="search" placeholder="Find a document…"><span id="count" class="muted"></span></div><div class="workspace"><section id="list" aria-label="Saved documents"></section><article><form id="document-form"><label for="title">Title</label><input id="title" maxlength="200" placeholder="Untitled"><label for="content">Document</label><textarea id="content" rows="18" maxlength="1000000" placeholder="Start writing…"></textarea><div class="actions"><button class="primary" id="save">Save document</button><button type="button" id="export">Export</button><button type="button" id="remove">Delete</button><span id="status" class="muted"></span></div></form><hr><details id="assistant"><summary>Write with local AI</summary><p class="muted">Choose an installed model. Generated text is a proposal; it is only saved when you apply it and save the document.</p><label for="model">Local model</label><select id="model"></select><label for="prompt">What would you like to write or change?</label><textarea id="prompt" rows="3" maxlength="12000" placeholder="Write an introduction, revise the structure, or improve clarity…"></textarea><button id="draft">Generate proposal</button><section id="proposal" hidden><h2>Proposed draft</h2><pre id="draft-text"></pre><div class="actions"><button id="apply-draft" class="primary">Use this draft</button><button id="discard-draft">Discard proposal</button></div></section></details></article></div><script src="model.js"></script><script src="app.js"></script></body></html>
